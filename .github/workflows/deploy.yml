# Builds both sites on every push to main.
# Construction -> this repo's GitHub Pages (cusumanohi.com).
# Dumpsters    -> gh-pages branch of Monroe-Humane/cusumano-dumpsters (cusdump.com),
#                 pushed with the deploy key stored in the DUMPSTERS_DEPLOY_KEY secret.
name: Deploy sites

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/construction
      - uses: actions/upload-artifact@v4
        with:
          name: dumpsters
          path: dist/dumpsters
          include-hidden-files: true

  deploy-construction:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-dumpsters:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dumpsters
          path: dumpsters
      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DUMPSTERS_DEPLOY_KEY }}
          external_repository: Monroe-Humane/cusumano-dumpsters
          publish_branch: gh-pages
          publish_dir: dumpsters
          cname: cusdump.com
          force_orphan: true
